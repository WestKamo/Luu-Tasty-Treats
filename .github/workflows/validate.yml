name: Validate frontend and .NET API

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/supabase-cake-image-storage-20261027

permissions:
  contents: read

jobs:
  dotnet-build:
    name: .NET 8 API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build LuuTastyTreats.sln --configuration Release --nologo

  nextjs-build:
    name: Next.js frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
